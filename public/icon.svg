<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />
  
  <!-- Optical Scan Target Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0e7490" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Face Contour / Biometric Matrix -->
  <path d="M 180 180 Q 256 140 332 180 Q 360 256 332 332 Q 256 372 180 332 Q 152 256 180 180 Z" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)" />
  
  <!-- rPPG ECG / Pulse Wave Overlay -->
  <path d="M 140 260 L 190 260 L 210 230 L 230 295 L 256 175 L 280 325 L 300 240 L 320 260 L 372 260" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  
  <!-- Corner Targeting Reticles -->
  <path d="M 100 140 L 100 100 L 140 100" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 412 140 L 412 100 L 372 100" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 100 372 L 100 412 L 140 412" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <path d="M 412 372 L 412 412 L 372 412" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  
  <!-- Status Core Indicator -->
  <circle cx="256" cy="256" r="10" fill="#22d3ee" />
</svg>
